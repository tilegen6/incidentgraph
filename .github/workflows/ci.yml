name: IncidentGraph CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:postgres
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Build and start the complete stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify web proxy, authentication and PostgreSQL writes
        run: node infra/scripts/smoke-compose.mjs
      - name: Restart the API and verify persistence
        run: |
          docker compose restart api
          docker compose up --detach --wait --wait-timeout 120
          node infra/scripts/smoke-compose.mjs --verify-persistence
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove the disposable CI stack
        if: always()
        run: docker compose down --volumes
