name: incidentgraph
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: incidentgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidentgraph-local}
      POSTGRES_DB: incidentgraph
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U incidentgraph -d incidentgraph']
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      PORT: 4100
      STORAGE_MODE: postgres
      DATABASE_URL: postgresql://incidentgraph:${POSTGRES_PASSWORD:-incidentgraph-local}@postgres:5432/incidentgraph
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3100
      SESSION_SECRET: ${SESSION_SECRET:-local-demo-only-replace-with-32-characters}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-investigate-demo}
      NODE_ENV: development
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - '127.0.0.1:4100:4100'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_URL: http://api:4100
    environment:
      API_URL: http://api:4100
    depends_on:
      api: { condition: service_healthy }
    ports:
      - '127.0.0.1:3100:3100'
volumes:
  postgres-data:
  redis-data:
